<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TPRM Benchmark{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/vendor/chart.umd.min.js"></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand"><span class="dot"></span>TPRM Benchmark</a>
    <nav>
      <a href="/" class="{% if nav == 'runs' %}active{% endif %}">Runs</a>
      <a href="{{ compare_href | default('/') }}" class="{% if nav == 'compare' %}active{% endif %}">Compare</a>
    </nav>
    <span class="spacer"></span>
    {% block topbar_right %}{% endblock %}
  </header>
  <main class="viz-root {% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
    <footer class="foot">
      <span>Results DB: <span class="mono">{{ DB_PATH }}</span></span>
      <span>Assessment = the app under test · Judge = the benchmark's own LLM grading · ≈ estimated from list prices · ⚠ under-reported</span>
    </footer>
  </main>
</body>
</html>
