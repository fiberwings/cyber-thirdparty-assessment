# Veltrix Onboard — synthetic evidence pack authored against an assessment date
# of 2 September 2026 (source: testdata/veltrix, git-ignored; answer key
# 08_Validation_Summary.xlsx, NOT uploaded). Pack ids (F01..F37, D01..D05) are
# quoted in comments so results can be mapped back to the pack's scorecard.
#
# Engagement requirements (MSA clauses + Bank TPISS v4.1) are carried in
# standards_profile because that block reaches every evidence stage
# (extraction, correlation, gap analysis, confirmation, exec summary); the
# description only reaches scenario generation. Document 00 is also uploaded
# as `other` so the engagement facts are in the evidence bundle.
#
# Goldens: the pack's 37 findings are represented as 28 goldens — pairs that a
# correct assessment would report as ONE finding (raw exception + the
# contradicting questionnaire claim) are merged, because the judge matches
# one-to-one. Severities follow the pack's key. Decoys D01–D05 cannot be
# expressed as goldens; D05 is a forbidden exec-summary claim.
id: veltrix
vendor_name: "Veltrix Onboard Pte. Ltd."
description: |
  Requesting organisation: Northgate Bank (Asia) Limited (the "Bank"), Third Party
  Risk Management on behalf of Corporate & Investment Banking — Client Lifecycle
  Management, Financial Crime Compliance and Coverage. Annual reassessment;
  assessment date 2 September 2026. Business owner: Head of Client Lifecycle
  Management, CIB APAC.

  Supplier: Veltrix Onboard Pte. Ltd. (UEN 201712345K), 71 Robinson Road,
  Singapore. Founded 2017; privately held, Series C (2023); FY2025 revenue
  USD 28.4m, profitable since FY2024. Headcount 210 (Singapore 84, Pune 96,
  remote 30). Wholly owned engineering subsidiary Veltrix Technologies India
  Pvt. Ltd. (Pune). ~40 financial-institution customers in APAC and Europe; the
  Bank is the largest customer (~11% of ARR). Vendor-claimed certifications:
  ISO/IEC 27001:2022, SOC 2 Type II (Security, Availability, Confidentiality).

  ### Service in scope: "Veltrix Onboard"
  Multi-tenant SaaS for onboarding corporate clients. Modules used by the Bank:
  - Client Data Capture — corporate entity data, ownership structures,
    beneficial-owner details including passport / national ID images
  - Document Vault — KYC/CDD documents (constitutional documents, proof of
    address, source-of-wealth documentation, board resolutions)
  - Screening — sanctions, PEP and adverse-media screening against third-party
    watch-list data, alert disposition and audit trail
  - Case Management — workflow for relationship managers, KYC analysts and
    compliance approvers, periodic-review scheduling
  - Veltrix IQ — intelligent-document-processing and adverse-media summarisation
    feature released Q1 2026 and enabled by default for all tenants; per the
    vendor's release notes it extracts fields from uploaded identity documents
    and summarises adverse-media hits using a third-party large language model
    API hosted in the United States (vendor states customer data is not used to
    train the model).

  ### Engagement scope
  Countries: Hong Kong SAR, Singapore, Japan, Australia, India. ~450 named Bank
  users incl. 12 Bank administrators; ~60 relationship managers use the mobile
  app (iOS/Android) for document capture. Go-live April 2025 (HK, SG); JP, AU,
  IN January 2026. Master Services Agreement 14 February 2025, 3-year term,
  USD 1.4m p.a. Classified as a material outsourcing arrangement (HKMA SPM SA-2;
  MAS Outsourcing Guidelines for the Singapore branch), notified to both
  regulators.

  ### Data processed
  - Corporate client identifiers (legal name, registration number, address,
    ownership structure) — Confidential — ~120,000 client entities
  - Personal data of related parties (directors, signatories, beneficial
    owners: full name, DOB, nationality, passport / national ID number,
    residential address) — Highly Confidential — ~380,000 individuals, ~4% EU
    residents
  - Identity and KYC documents (passport / ID images, proof of address,
    source-of-wealth statements, bank statements) — Highly Confidential —
    ~2.1 million documents
  - Screening results (sanctions / PEP / adverse-media hits and analyst
    dispositions) — Highly Confidential — ~1.6 million alerts cumulative
  - Relationship-manager case notes — Confidential
  No cardholder data, Bank system credentials or trading data.

  ### Architecture and integration (as disclosed by Veltrix)
  AWS; primary region ap-southeast-1 (Singapore); DR replica in eu-west-1
  (Ireland) with continuous database replication and hourly object-storage
  replication. Multi-tenant application and database with logical tenant
  separation (tenant_id scoping), dedicated S3 prefix per tenant. Integration:
  REST API (client and related-party data pushed from the Bank's CRM, case
  status pulled back) authenticated with tenant-scoped API keys; nightly SFTP
  batch exchange (screening deltas, periodic-review lists) via
  legacy-sftp.veltrix.io. SAML 2.0 SSO with the Bank's IdP for all Bank users;
  Bank administrators also hold local break-glass accounts. No vendor
  connectivity into the Bank network; outbound from the Bank over HTTPS and
  SFTP only.

  ### Vendor personnel and locations with access to Bank data
  - Singapore — platform operations, security, customer success — production
    administrative access — Veltrix employees
  - Pune, India — engineering and 24x7 L3 production support — production
    support access including break-glass database access — Veltrix
    Technologies India employees
  - Manila, Philippines — tier-1 customer support — read access to case
    records and attachments via the support console — Cerulean Support
    Services Inc. (BPO contractor)

  ### Fourth parties identified by the Bank during due diligence
  Amazon Web Services (Singapore; Ireland DR); Cerulean Support Services Inc.
  (Manila BPO, read access to case records); WatchTower Data Ltd (London,
  sanctions / PEP / adverse-media data, receives names of screened parties);
  OptiRead Pte. Ltd. (Singapore, OCR of identity documents, receives document
  images); a US-based large language model API provider (name not disclosed by
  Veltrix; Veltrix IQ, receives document images and adverse-media text);
  Datadog (US SaaS, application logs, stated to be masked). Compare with the
  subprocessor list declared in the security questionnaire.

  ### Criticality and substitutability
  Corporate onboarding and periodic KYC reviews in five markets cannot be
  completed without the platform; the manual workaround (spreadsheet capture,
  manual screening) is sustainable for ~5 business days before regulatory KYC
  timelines are at risk. Bank BIA: Recovery Tier 2 — RTO 8 hours, RPO 1 hour.
  Exit / migration estimated at 6–9 months (2.1m documents); exit plan exists
  but is untested. Veltrix is the Bank's sole APAC onboarding platform. No
  incidents reported to the Bank since go-live.

  ### Contractual requirements (MSA 14 Feb 2025) and Bank standard (TPISS v4.1)
  Data stored and processed only in Singapore and Hong Kong SAR (cl. 12.1);
  current subprocessor list with 30 days' notice of new subprocessors (12.4);
  security-incident notification within 24 hours of detection (13.2); annual
  SOC 2 Type II and independent penetration test covering all components used
  to deliver the service, critical and high findings remediated within 30 days
  (13.5); right to audit incl. on-site and by regulators (13.7); BC/DR plan
  tested annually to RTO 8h / RPO 1h (14.1); cyber liability insurance
  ≥ USD 10m per claim (15.3); return and certified deletion of Customer Data
  within 30 days of termination (16.2). TPISS: MFA for all administrative and
  remote access; critical vulnerabilities fixed within 14 days, high within
  30; security logs retained ≥ 12 months; privileged access reviewed at least
  quarterly; annual independent pen test covering all customer-facing
  interfaces with retest of critical/high findings; background screening of
  all personnel with access to Bank data including contractors; AES-256 at
  rest and TLS 1.2+ only in transit; annual DR test meeting contracted RTO/RPO.

  ### Assessment objective
  Determine whether Veltrix's control environment, as described and evidenced,
  meets the Bank's Tier-1 / material-outsourcing requirements, the MSA and
  TPISS v4.1. Identify control gaps, inconsistencies between questionnaire
  claims and the vendor's own policies, SOC 2 and penetration test, contract
  breaches, and assurance blind spots (scope exclusions, carved-out subservice
  organisations, undisclosed fourth parties). The bundle must be read jointly:
  several gaps exist only when the questionnaire is reconciled with the
  policies, the SOC 2 exceptions and scope, and the pen test scope and
  remediation table. Absence of requested evidence is itself a finding.
  Evidence: Bank engagement summary; Bank security questionnaire v4 (80
  questions, returned 25 Aug 2026); Information Security Policy v3.2; Access
  Control Policy v2.0; Incident Response Policy v1.4; BC/DR Policy v2.1; SOC 2
  Type II (Harrow & Pell LLP, period 1 Jul 2024 – 30 Jun 2025); external
  penetration test (Greyline Security Ltd, 28 Nov 2025). Requested but not
  provided: SOC 2 bridge letter; current ISO 27001 certificate; Cerulean
  Support Services assurance report; DR test report 2025/2026; pen test
  retest report.
