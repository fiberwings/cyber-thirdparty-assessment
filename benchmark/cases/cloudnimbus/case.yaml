id: cloudnimbus
vendor_name: "CloudNimbus Financial Cloud Services Ltd."
description: |
  ### Assessing organisation and standards
  Client: Aurora Investment Bank plc (Cyber Third-Party Risk Management). The
  assessment reference date is 1 May 2026. Aurora's standards applied to vendors:
  - TPRM Std 5.1: a current SOC 2 Type II (or ISO 27001 plus equivalent) is required
    for any vendor processing confidential data or employee/client PII; SOC 1 alone
    is not sufficient.
  - TPRM Std 5.4: SOC reports must be refreshed within 12 months of period end;
    certifications must be current (not expired) at the time of assessment.
  - TPRM Std 8.2: independent external penetration test by an accredited firm at
    least every 12 months, covering all bank-facing integration channels.
  - TPRM Std 6.4: a complete, versioned sub-processor list; all sub-processors that
    touch bank data must be disclosed in the DPA with an adequate transfer basis.
  - Crypto Std 4.1/4.2: documented encryption at rest with customer-managed or
    per-tenant keys and defined rotation; SFTP with key-based auth (4.3).
  - Resilience Std 6.1: cross-region backups, defined RTO/RPO, and a live DR test
    within 12 months; restore-from-backup tests at least semi-annually.
  - Privacy Std 3.4: PII retention target of 5 years for non-regulated data with
    automated deletion; policies reviewed at least annually.
  - IAM Std 2.1: phishing-resistant MFA mandatory for administrators; NIST 800-63B
    password policy.

  ### Vendor and service
  CloudNimbus Financial Cloud Services Ltd. (London; ~1,400 FTE; founded 2015)
  provides FCA/PRA-aligned managed cloud infrastructure (IaaS/PaaS) hosting
  Aurora's electronic trading platform, derivatives pricing engine, intraday risk
  engine and Murex sub-ledger: dedicated tenancy compute, block/object storage,
  dedicated network fabrics, managed Kubernetes, managed Postgres and Kafka,
  HSM-backed key management (FIPS 140-2 L3), 24x7 L1/L2 operations with SRE squads.
  Criticality: Tier 1 - Critical. Data: Highly Confidential / MNPI - real-time
  market data, trade execution/allocation/settlement records, institutional client
  positions and exposures, proprietary pricing models (IP), security logs.
  ~480 TB hot, 6.2 PB cold. GBP 18.7m ACV, 5-year MSA.
  Geography: primary London (LON1, LON3), DR Frankfurt (FRA2); contractual data
  residency EEA only. Connectivity: two redundant 10 Gbps private circuits
  (Equinix), mutual-TLS API plane with FIDO2 for SRE access, SAML SSO + SCIM,
  PAM bastion with session recording, SFTP gateway with S/MIME signed payloads.
  Disclosed sub-processors: Equinix UK, Cloudflare (US), PagerDuty (US), Tessian
  (UK), Datadog APM Pte. Ltd. (Singapore). Vendor-claimed certifications: ISO
  27001/27017/27018 (BSI), PCI DSS v4.0, SOC 1 and SOC 2 Type II (KPMG).
  Vendor self-asserted maturity: Very High. Evidence: context document, ISP v6.4,
  BCP/DR v4.2, SIG Lite 2026Q2, SOC 2 Type II 2025-2026, ISO 27001 certificate,
  pen test attestation.
documents:
  - path: docs/Context_CloudNimbus.docx
    kind: other
  - path: docs/SIG_Lite_Response_CloudNimbus_2026Q2.xlsx
    kind: questionnaire
  - path: docs/SOC_Report_CloudNimbus_2025-2026.pdf
    kind: soc
  - path: docs/ISO27001_Certificate_CloudNimbus.pdf
    kind: iso
  - path: docs/PenTest_Attestation_CloudNimbus.pdf
    kind: pentest
  - path: docs/Information_Security_Policy_CloudNimbus_v6.4.docx
    kind: policy
  - path: docs/BCP_DR_Policy_CloudNimbus_v4.2.docx
    kind: policy
golden:
  expected_band: Moderate
  expected_weaknesses:
    - id: CN-G1
      description: >-
        Undisclosed fourth-party in Singapore: Datadog APM Pte. Ltd. (Singapore) is
        referenced in the SOC 2 Section IV and the sub-processor list but does not
        appear in the executed DPA Schedule 3 (EU/UK/US only), so the EEA-only data
        residency commitment is potentially compromised for telemetry.
      severity: medium
    - id: CN-G2
      description: >-
        Penetration test cadence drift: ISP 11.4 mandates external pen testing at
        least every 12 months for Tier-1 services but the latest attestation is
        dated 2025-01-22 (over 15 months before the May 2026 assessment) with no
        scheduled re-test.
      severity: low
    - id: CN-G3
      description: >-
        TLS 1.2 with a legacy cipher allow-list is permitted for legacy SFTP
        partner gateways with no documented sunset date and no quarterly review of
        the cipher allow-list (SIG H.6 / ISP 9.2).
      severity: low
  exec_summary_rubric:
    must_cover:
      - id: CN-K1
        point: >-
          An overall residual risk verdict is stated and it is broadly moderate
          (a strong control environment with limited residual gaps).
      - id: CN-K2
        point: >-
          The Singapore-based Datadog sub-processor / data residency inconsistency
          is mentioned.
      - id: CN-K3
        point: >-
          The overdue external penetration test is mentioned.
      - id: CN-K4
        point: >-
          The strength of the evidenced control environment (unqualified SOC 2,
          current ISO 27001, recent live DR test) is acknowledged.
    must_not_claim:
      - id: CN-F1
        claim: >-
          The penetration test is current / performed within the last 12 months.
      - id: CN-F2
        claim: >-
          All sub-processors are located within the EEA/UK/US or covered by the DPA.
      - id: CN-F3
        claim: >-
          The SOC 2 opinion was qualified or contained material exceptions.
