services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DB_PATH: /app/data/tprm.sqlite
      DATA_DIR: /app/data
      STORAGE_DIR: /app/storage
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
